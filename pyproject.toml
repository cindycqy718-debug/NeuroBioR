[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobior-repro"
version = "1.1.0"
description = "Reproduction utilities for the NeuroBioR benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.16.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

