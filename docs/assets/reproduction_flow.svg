<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">NeuroBioR fixed Agent and LLM evaluation workflow</title>
  <desc id="desc">Three Medformer-aligned test datasets flow through a fixed prompt and Agent, a variable LLM backbone, a deterministic predictor, and a six-metric scorer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f7f4ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4d68d8"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17213a}.lane{fill:url(#bg);stroke:#b9c5e6;stroke-width:2}.box{fill:white;stroke:#6377c9;stroke-width:2}.accent{fill:#eef3ff;stroke:#6377c9;stroke-width:2}.warn{fill:#fff8e8;stroke:#d49a28;stroke-width:2}.ok{fill:#eefaf2;stroke:#46a36b;stroke-width:2}.h{font:700 23px Arial,sans-serif;fill:#18233d}.t{font:18px Arial,sans-serif;fill:#34405c}.small{font:16px Arial,sans-serif;fill:#52607e}.arrow{stroke:#4d68d8;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="0" y="0" width="1600" height="720" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">NeuroBioR: protocol-aligned benchmark reproduction</text>

  <rect x="35" y="85" rx="20" width="1530" height="175" class="lane"/>
  <text x="65" y="120" class="h">1. Fixed data contract</text>
  <rect x="65" y="145" rx="14" width="330" height="85" class="box"/>
  <text x="230" y="178" text-anchor="middle" class="h">Processed EEG</text>
  <text x="230" y="207" text-anchor="middle" class="t">APAVA · TDBRAIN · ADFTD</text>
  <path d="M410 187 H520" class="arrow"/>
  <rect x="535" y="145" rx="14" width="390" height="85" class="accent"/>
  <text x="730" y="178" text-anchor="middle" class="h">Official subject split</text>
  <text x="730" y="207" text-anchor="middle" class="t">TEST only · no label exposure</text>
  <path d="M940 187 H1050" class="arrow"/>
  <rect x="1065" y="145" rx="14" width="440" height="85" class="box"/>
  <text x="1285" y="178" text-anchor="middle" class="h">Aligned one-second windows</text>
  <text x="1285" y="207" text-anchor="middle" class="t">float32 · 256 time points · C channels</text>

  <rect x="35" y="280" rx="20" width="1530" height="215" class="lane"/>
  <text x="65" y="315" class="h">2. Fixed Agent; only the LLM backbone changes</text>
  <rect x="65" y="350" rx="14" width="260" height="105" class="box"/>
  <text x="195" y="385" text-anchor="middle" class="h">Fixed prompt</text>
  <text x="195" y="414" text-anchor="middle" class="small">task + interface + rules</text>
  <path d="M340 402 H430" class="arrow"/>
  <rect x="445" y="350" rx="14" width="290" height="105" class="warn"/>
  <text x="590" y="385" text-anchor="middle" class="h">Tested LLM</text>
  <text x="590" y="414" text-anchor="middle" class="small">5 retained backbones</text>
  <path d="M750 402 H840" class="arrow"/>
  <rect x="855" y="350" rx="14" width="300" height="105" class="accent"/>
  <text x="1005" y="385" text-anchor="middle" class="h">Generated predictor</text>
  <text x="1005" y="414" text-anchor="middle" class="small">window → K probabilities</text>
  <path d="M1170 402 H1260" class="arrow"/>
  <rect x="1275" y="350" rx="14" width="230" height="105" class="ok"/>
  <text x="1390" y="385" text-anchor="middle" class="h">Full TEST run</text>
  <text x="1390" y="414" text-anchor="middle" class="small">complete [N,K] output</text>
  <text x="785" y="478" text-anchor="middle" class="small">Request indices 41 · 42 · 43 · 44 · 45</text>

  <rect x="35" y="515" rx="20" width="1530" height="170" class="lane"/>
  <text x="65" y="550" class="h">3. Protocol-aligned scoring and reporting</text>
  <rect x="65" y="580" rx="14" width="420" height="75" class="box"/>
  <text x="275" y="612" text-anchor="middle" class="h">Private local scorer</text>
  <text x="275" y="639" text-anchor="middle" class="small">labels never sent to the LLM</text>
  <path d="M500 617 H610" class="arrow"/>
  <rect x="625" y="580" rx="14" width="500" height="75" class="accent"/>
  <text x="875" y="612" text-anchor="middle" class="h">Six matched metrics</text>
  <text x="875" y="639" text-anchor="middle" class="small">Accuracy · P · R · F1 · AUROC · AUPRC</text>
  <path d="M1140 617 H1250" class="arrow"/>
  <rect x="1265" y="580" rx="14" width="240" height="75" class="ok"/>
  <text x="1385" y="612" text-anchor="middle" class="h">Mean ± sample SD</text>
  <text x="1385" y="639" text-anchor="middle" class="small">five complete runs</text>
</svg>
